[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "standalone-automation-utilities"
version = "0.1.0"
description = "Local-first utilities for repetitive business operations"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
automation-utils = "automation_utilities.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
