apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-integration
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: api-integration
  template:
    metadata:
      labels:
        app: api-integration
    spec:
      containers:
        - name: api-integration
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
