apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bulk-file-processing.fullname" . | default "bulk-file-processing" }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: bulk-file-processing
  template:
    metadata:
      labels:
        app: bulk-file-processing
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
