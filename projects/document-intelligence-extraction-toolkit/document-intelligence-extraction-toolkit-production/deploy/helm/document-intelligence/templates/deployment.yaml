apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: document-intelligence
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: document-intelligence
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-intelligence
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MAX_UPLOAD_BYTES
              value: {{ .Values.env.MAX_UPLOAD_BYTES | quote }}
            - name: ALLOWED_EXTENSIONS
              value: {{ .Values.env.ALLOWED_EXTENSIONS | quote }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
