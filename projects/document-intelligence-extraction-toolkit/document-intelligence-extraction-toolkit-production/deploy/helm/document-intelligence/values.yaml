replicaCount: 1
image:
  repository: document-intelligence
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 8000
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  MAX_UPLOAD_BYTES: "10485760"
  ALLOWED_EXTENSIONS: ".txt,.md,.csv,.pdf"
