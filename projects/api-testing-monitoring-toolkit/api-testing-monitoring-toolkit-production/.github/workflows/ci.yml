name: API Toolkit CI
on:
  push:
    paths:
      - "projects/api-testing-monitoring-toolkit/**"
  pull_request:
    paths:
      - "projects/api-testing-monitoring-toolkit/**"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/api-testing-monitoring-toolkit/api-testing-monitoring-toolkit-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q
